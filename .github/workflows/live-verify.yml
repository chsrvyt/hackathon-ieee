name: Live verification

# Verifies a deployed AttendAI instance end to end from GitHub's runners:
# Actions -> Live verification -> Run workflow -> paste the public URL (e.g. https://attendai.onrender.com).
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Public AttendAI URL (https://...)"
        required: true
      android:
        description: "Also run the Android app against this server on an emulator"
        type: boolean
        default: true

permissions:
  contents: read
  actions: read # download the latest APK build artifact

concurrency:
  group: live-verify
  cancel-in-progress: false

jobs:
  web:
    name: Website (acceptance, security, responsive, accessibility)
    runs-on: ubuntu-latest
    env:
      E2E_BASE_URL: ${{ inputs.url }}
      E2E_PRODUCTION: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Check URL
        run: |
          case "$E2E_BASE_URL" in https://*) ;; *) echo "::error::URL must start with https://"; exit 1;; esac
      - name: Wake the service and check /health (free instances sleep when idle)
        run: |
          for i in $(seq 1 36); do
            body=$(curl -s --max-time 20 "$E2E_BASE_URL/health" || true)
            echo "attempt $i: ${body:-no response}"
            [ "$body" = '{"status":"ok"}' ] && exit 0
            sleep 10
          done
          echo "::error::$E2E_BASE_URL/health did not return {\"status\":\"ok\"}"; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run the live test suite
        working-directory: e2e
        run: npx playwright test --reporter=list,html
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results

  android:
    name: Android app against the live server
    if: ${{ inputs.android }}
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Latest debug APK from the Android workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          RUN=$(gh run list --workflow android.yml --branch "$GITHUB_REF_NAME" --status success -L 1 --json databaseId -q '.[0].databaseId')
          [ -n "$RUN" ] || RUN=$(gh run list --workflow android.yml --status success -L 1 --json databaseId -q '.[0].databaseId')
          echo "using Android workflow run $RUN"
          gh run download "$RUN" -n attendai-apk -D dist-apk
          ls -la dist-apk
          echo "APK=$(ls dist-apk/*-debug.apk | head -1)" >> "$GITHUB_ENV"
      - name: Install Playwright (Android driver)
        working-directory: e2e
        run: npm ci
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the app on an emulator against the live HTTPS server
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r "${{ env.APK }}"
            cd e2e && APP_SERVER_URL="${{ inputs.url }}" SCREENSHOT_DIR="$GITHUB_WORKSPACE/live-android-screenshots" node android/app-smoke.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-android-screenshots
          path: live-android-screenshots/
          if-no-files-found: ignore
