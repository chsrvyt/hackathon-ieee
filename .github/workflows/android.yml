name: Android app

on:
  push:
    branches: ["**"]
    paths:
      - "frontend/**"
      - "e2e/android/**"
      - "backend/app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      server_url:
        description: "Default AttendAI server URL baked into the app (optional, e.g. https://attendai.onrender.com)"
        required: false
        default: ""

permissions:
  contents: write # publish the APK as a GitHub Release

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION_CODE: ${{ github.run_number }}
  VERSION_NAME: 1.0.${{ github.run_number }}

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - run: npm ci
      - name: Build web bundle
        env:
          VITE_DEFAULT_SERVER_URL: ${{ inputs.server_url || vars.ATTENDAI_SERVER_URL }}
        run: npm run build
      - run: npx cap sync android
      - name: Release signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            echo "SIGNING=stable" >> "$GITHUB_ENV"
          else
            # No signing secrets configured: sign with a throw-away key generated for this build only.
            KEYSTORE_PASSWORD="$(openssl rand -hex 24)"; KEY_PASSWORD="$KEYSTORE_PASSWORD"; KEY_ALIAS=attendai
            echo "::add-mask::$KEYSTORE_PASSWORD"
            keytool -genkeypair -keystore "$KS" -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 3650 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" -dname "CN=AttendAI build ${VERSION_NAME}" > /dev/null
            echo "SIGNING=ephemeral" >> "$GITHUB_ENV"
          fi
          {
            echo "ANDROID_KEYSTORE_PATH=$KS"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Gradle build (release + debug)
        working-directory: frontend/android
        run: |
          ./gradlew --no-daemon --stacktrace assembleRelease assembleDebug \
            -PattendaiVersionCode="$VERSION_CODE" -PattendaiVersionName="$VERSION_NAME"
      - name: Verify APKs
        working-directory: frontend/android/app/build/outputs/apk
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/apksigner" verify --print-certs release/app-release.apk | head -3
          "$BT/aapt2" dump badging release/app-release.apk | grep -E "^package|sdkVersion|targetSdkVersion|application-label:"
          mkdir -p "$GITHUB_WORKSPACE/dist-apk"
          cp release/app-release.apk "$GITHUB_WORKSPACE/dist-apk/AttendAI-${VERSION_NAME}.apk"
          cp debug/app-debug.apk "$GITHUB_WORKSPACE/dist-apk/AttendAI-${VERSION_NAME}-debug.apk"
          ls -la "$GITHUB_WORKSPACE/dist-apk"
          echo "signing=$SIGNING" > "$GITHUB_WORKSPACE/dist-apk/build-info.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: attendai-apk
          path: dist-apk/
          if-no-files-found: error

  device-test:
    name: Emulator smoke test
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: attendai
          POSTGRES_USER: attendai
          POSTGRES_PASSWORD: attendai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U attendai" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://attendai:attendai@localhost:5432/attendai
      SECRET_KEY: ci-only-not-a-secret-0123456789abcdefghijklmnop
      DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start API (migrate + seed)
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          python -m app.seed
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/health && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/api.log"; exit 1
      - uses: actions/download-artifact@v4
        with:
          name: attendai-apk
          path: dist-apk
      - name: Install Playwright (Android driver)
        working-directory: e2e
        run: npm ci
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run app on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r dist-apk/AttendAI-${{ env.VERSION_NAME }}-debug.apk
            adb reverse tcp:8000 tcp:8000
            cd e2e && SCREENSHOT_DIR="$GITHUB_WORKSPACE/android-screenshots" node android/app-smoke.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshots
          path: android-screenshots/
          if-no-files-found: ignore
      - if: failure()
        run: tail -50 "$RUNNER_TEMP/api.log" || true

  publish:
    name: Publish APK release
    runs-on: ubuntu-latest
    needs: [build, device-test]
    if: >-
      always() && needs.build.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || github.ref_name == 'main' ||
       github.ref_name == 'claude/lucid-mccarthy-05cpem')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: attendai-apk
          path: dist-apk
      - name: Create or replace the "android-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEVICE_TEST: ${{ needs.device-test.result }}
        run: |
          SIGNING=$(sed -n 's/^signing=//p' dist-apk/build-info.txt)
          if [ "$DEVICE_TEST" = "success" ]; then TESTED="✅ Passed the automated smoke test on an Android 14 emulator (sign-in, dashboards, navigation, back button)."; else TESTED="⚠️ The emulator smoke test did not pass for this build (result: $DEVICE_TEST)."; fi
          if [ "$SIGNING" = "ephemeral" ]; then SIGNNOTE="Signed with a key generated for this build. To update, uninstall the previous build first (or configure the ANDROID_KEYSTORE_* repository secrets for stable signing)."; else SIGNNOTE="Signed with the project release key."; fi
          cat > notes.md <<EOF
          AttendAI Android app **${VERSION_NAME}** built from \`${GITHUB_SHA::7}\`.

          **Install:** download \`AttendAI-${VERSION_NAME}.apk\` on an Android 7.0+ phone, open it and allow installing from this source.
          On first launch enter your AttendAI server address (the hosted website, e.g. \`https://attendai.onrender.com\`), then sign in.
          Demo accounts use the password \`Demo@2026\` (\`student@attendai.demo\`, \`mentor@attendai.demo\`, \`admin@attendai.demo\`, \`examcell@attendai.demo\`).

          ${TESTED}

          ${SIGNNOTE}
          EOF
          sed -i 's/^          //' notes.md
          gh release delete android-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create android-latest "dist-apk/AttendAI-${VERSION_NAME}.apk" \
            --title "AttendAI Android app ${VERSION_NAME}" --notes-file notes.md --target "$GITHUB_SHA" --latest
