name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests on PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: attendai_test
          POSTGRES_USER: attendai
          POSTGRES_PASSWORD: attendai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U attendai" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://attendai:attendai@localhost:5432/attendai_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: alembic upgrade head && alembic check
      - run: python -m pytest -o addopts="" -q

  frontend:
    name: Frontend (typecheck + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx vitest run
      - run: npx vite build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  e2e:
    name: End-to-end acceptance (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: attendai
          POSTGRES_USER: attendai
          POSTGRES_PASSWORD: attendai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U attendai" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://attendai:attendai@localhost:5432/attendai
      APP_ENV: production
      SECRET_KEY: ci-only-not-a-secret-0123456789abcdefghijklmnop
      DEMO_MODE: "true"
      STATIC_DIR: ${{ github.workspace }}/frontend/dist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Start backend (migrate, seed, serve SPA)
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          python -m app.seed
          nohup uvicorn app.main:app --port 8000 > ../uvicorn.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/health && exit 0; sleep 1; done
          cat ../uvicorn.log; exit 1
      - name: Run Playwright
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8000
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
            uvicorn.log

  docker:
    name: Production image builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: attendai:ci
