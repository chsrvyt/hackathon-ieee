# Render Blueprint: one Docker web service (API + SPA) and a managed PostgreSQL database.
# Deploy: Render dashboard -> New -> Blueprint -> select this repository -> Apply.
# Secrets: none are stored here. DATABASE_URL comes from the database, SECRET_KEY is generated by Render.
databases:
  - name: attendai-db
    plan: free
    postgresMajorVersion: "16"
    databaseName: attendai
    user: attendai
    ipAllowList: []  # no public access; the web service uses the private connection string

services:
  - type: web
    name: attendai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: attendai-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production # Secure cookies, HSTS, no API docs, generic errors
      # CORS: the website is same-origin and needs none; only the Android/iOS app WebViews are allowed.
      - key: MOBILE_APP_ORIGINS
        value: https://localhost,capacitor://localhost
      - key: WEB_CONCURRENCY
        value: "1"
      # Demo deployment: seed fictional data and show the demo-account panel on the login page.
      # Set both to "false" for a real institution.
      - key: SEED_DEMO_DATA
        value: "true"
      - key: DEMO_MODE
        value: "true"
